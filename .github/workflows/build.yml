name: Build Mod Jar

on:
  # Кнопка «Run workflow» во вкладке Actions — сборка вручную в один клик
  workflow_dispatch:
  # Автосборка при каждом пуше кода (можно удалить, если не нужно)
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Забираем код из репозитория
      - name: Check out sources
        uses: actions/checkout@v4

      # 2. Ставим JDK 8 — именно её требует Forge 1.16.5
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      # 3. Делаем gradlew исполняемым (в zip права доступа слетают)
      - name: Make gradlew executable
        run: chmod +x gradlew

      # 4. Собираем мод (первый запуск скачает зависимости — это нормально)
      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace

      # 5. Выкладываем готовый .jar как артефакт сборки
      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThirteenFlames-1.16.5
          path: build/libs/*.jar
          if-no-files-found: error
